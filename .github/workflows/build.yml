name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Android, iOS, and web bundles
        run: npx expo export --platform all
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundles
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -r -n1 node --check
